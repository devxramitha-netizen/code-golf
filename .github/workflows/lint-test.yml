# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "build" job
# - [MEDIUM] Add concurrency group to "lint-test.yml"
# Estimated savings: ~6 min/run
#
name: Lint & Test
'on':
  workflow_dispatch:
  pull_request: null
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm install --allow-git=root
      - run: make lint
      - run: make test
      - run: go install filippo.io/mkcert@latest
      - run: make cert
      - run: make e2e
        env:
          COMPOSE_PARALLEL_LIMIT: 1
